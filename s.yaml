edition: 3.0.0
name: ai-island-app
access: default

vars:
  region: cn-hongkong

resources:
  framework:
    component: fc3
    actions:
      pre-deploy:
        - run: npm install
          path: ./
        - run: npm run build
          path: ./
    props:
      region: ${vars.region}
      functionName: RobotPrinter-miph
      description: "AI Island RobotPrinter 组件"
      runtime: custom.debian10
      cpu: 0.1
      memorySize: 256
      diskSize: 512
      timeout: 60
      code: ./
      customRuntimeConfig:
        command:
          - npm
        args:
          - run
          - preview
          - --
          - --host
          - "0.0.0.0"
          - --port
          - "9000"
        port: 9000
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - HEAD
              - PATCH
