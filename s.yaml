edition: 3.0.0
name: ai-island-app
access: default

vars:
  region: cn-hongkong

resources:
  framework:
    component: fc3
    actions:
      pre-deploy:
        - run: |
            echo "Installing Node.js 20..."
            curl -fsSL https://nodejs.org/dist/v20.11.1/node-v20.11.1-linux-x64.tar.xz -o node-v20.tar.xz
            tar -xf node-v20.tar.xz
            export PATH=$PWD/node-v20.11.1-linux-x64/bin:$PATH
            echo "Node version: $(node -v)"
            echo "NPM version: $(npm -v)"
            npm install
            npm run build
            rm -rf node-v20.tar.xz node-v20.11.1-linux-x64
          path: ./
    props:
      region: ${vars.region}
      functionName: RobotPrinter-miph
      description: "AI Island RobotPrinter 组件"
      runtime: custom.debian10
      cpu: 0.1
      memorySize: 256
      diskSize: 512
      timeout: 60
      code: ./
      customRuntimeConfig:
        command:
          - npm
        args:
          - run
          - preview
          - --
          - --host
          - "0.0.0.0"
          - --port
          - "9000"
        port: 9000
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - HEAD
              - PATCH
