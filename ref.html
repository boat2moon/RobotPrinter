<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Printer Input</title>
    <style>
        body {
            margin: 0;
            background-color: #f0f2f5; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            height: 100vh;
            display: block; 
            overflow: hidden; 
        }

        .page-content {
            padding: 60px 20px;
            color: #a0aec0;
            text-align: center;
        }
        
        h1 { font-weight: 300; letter-spacing: 1px; }

        #bottom-dock {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 300px;
            z-index: 1000;
            perspective: 1000px; 
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        #real-input-container {
            position: absolute;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            
            top: 50%; 
            left: 50%;
            transform-origin: center center;
            transform: translate(-50%, -50%) rotateX(30deg); 
            
            pointer-events: none;
        }

        #real-input {
            width: 100%; 
            height: 100%;
            background: transparent;
            border: none; 
            outline: none;
            font-size: 22px;
            color: #2c3e50;
            text-align: left;
            padding-left: 30px; 
            padding-right: 30px;
            box-sizing: border-box;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 1px rgba(255,255,255,0.8);
            font-weight: 500;
            font-family: "KaiTi", "STKaiti", "楷体", serif;
            transition: color 0.5s ease;
        }
        
        #real-input::placeholder {
            color: rgba(100, 100, 100, 0.4); 
            font-weight: 400; 
            font-style: italic;
        }
        
        .hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #cbd5e0;
            pointer-events: none;
            opacity: 0.8;
            letter-spacing: 1px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

    <div class="page-content">
        <h1>ROBOT NOTES</h1>
        <p>Click the robot to spit out a note.</p>
    </div>

    <div id="bottom-dock">
        <div id="canvas-container"></div>
        <div id="real-input-container">
            <input type="text" id="real-input" placeholder="输入记录...">
        </div>
        <div class="hint">点击机器人收纳/展开</div>
    </div>

    <script>
        const CONFIG = {
            paperWidth: 700,   // [修改] 纸张加长
            paperHeight: 90, 
            segments: 100,     
            
            // 机器人尺寸
            robotSize: 100, 
            
            animDuration: 1200,
            tiltAngle: -0.52, // rotateX(30deg)
            cameraFrustum: 600
        };

        const THEME = {
            paperBase: '#fdfdfd', 
            robotColor: 0xe0d8c0, // 复古米色 (Retro Beige)
            robotDark: 0x555555, 
            screenColor: 0x111111,
            eyeColor: 0x00ffcc,   // 青色电子眼
        };

        let scene, camera, renderer;
        let paperMesh, robotGroup, mainGroup;
        let leftEye, rightEye; 
        let originalPositions = []; 
        let isExpanded = false; 
        let isAnimating = false;
        
        const animState = { val: 0 }; 

        const dockContainer = document.getElementById('bottom-dock');
        const canvasContainer = document.getElementById('canvas-container');
        const inputContainer = document.getElementById('real-input-container');
        const inputField = document.getElementById('real-input');

        function init() {
            scene = new THREE.Scene();
            
            const width = dockContainer.clientWidth;
            const height = dockContainer.clientHeight;
            const aspect = width / height;
            
            const frustumSize = CONFIG.cameraFrustum; 
            camera = new THREE.OrthographicCamera(
                frustumSize * aspect / -2, frustumSize * aspect / 2, 
                frustumSize / 2, frustumSize / -2, 
                1, 2000
            );
            camera.position.set(0, 100, 500); 
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
            canvasContainer.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.6); 
            scene.add(ambient);

            const mainLight = new THREE.DirectionalLight(0xffffff, 0.9);
            mainLight.position.set(-100, 300, 400); 
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.radius = 4;
            scene.add(mainLight);

            const fillLight = new THREE.DirectionalLight(0xffeedd, 0.5);
            fillLight.position.set(300, 100, 200);
            scene.add(fillLight);

            mainGroup = new THREE.Group();
            scene.add(mainGroup);
            mainGroup.rotation.x = CONFIG.tiltAngle;

            createRobot();
            createPaper();
            
            updateScroll(0);
            updateInputLayout();

            // 启动眨眼动画
            startBlinking();

            window.addEventListener('resize', onResize);
            
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            
            const handleInteract = (clientX, clientY) => {
                if (isAnimating) return;

                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(robotGroup.children, true);
                
                if (intersects.length > 0) {
                    toggle();
                }
            };

            renderer.domElement.addEventListener('click', (e) => handleInteract(e.clientX, e.clientY));
            renderer.domElement.addEventListener('touchstart', (e) => {
                if(e.touches.length > 0) {
                    handleInteract(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, {passive: true});

            renderer.domElement.addEventListener('mousemove', (e) => {
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(robotGroup.children, true);
                document.body.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
            });

            animate();
        }

        function updateInputLayout() {
            const containerHeight = dockContainer.clientHeight;
            const scale = containerHeight / CONFIG.cameraFrustum;

            const pixelPaperWidth = CONFIG.paperWidth * scale;
            const pixelPaperHeight = CONFIG.paperHeight * scale;
            const pixelRobotWidth = 120 * scale; 

            inputContainer.style.width = `${pixelPaperWidth}px`;
            inputContainer.style.height = `${pixelPaperHeight}px`;
            
            const offsetPx = -(pixelRobotWidth / 2);
            inputContainer.style.transform = `translate(calc(-50% + ${offsetPx}px), -50%) rotateX(30deg)`;

            const fontSize = Math.max(14, Math.floor(pixelPaperHeight * 0.45));
            inputField.style.fontSize = `${fontSize}px`;
        }

        function createRobot() {
            robotGroup = new THREE.Group();
            
            // 机器人尺寸
            const w = 120;
            const h = 100;
            const d = 90;

            // 1. 头壳 (Head Case) - 复古米色
            const bodyGeom = new THREE.BoxGeometry(w, h, d);
            const matBody = new THREE.MeshStandardMaterial({ 
                color: THEME.robotColor, 
                roughness: 0.4,
                metalness: 0.2
            });
            const body = new THREE.Mesh(bodyGeom, matBody);
            body.castShadow = true;
            body.receiveShadow = true;
            robotGroup.add(body);

            // 2. 脸部屏幕 (Face Screen) - 嵌入正面 (Z+)
            const screenGeom = new THREE.BoxGeometry(w * 0.8, h * 0.6, 5);
            const matScreen = new THREE.MeshStandardMaterial({ 
                color: THEME.screenColor,
                roughness: 0.2,
                metalness: 0.8
            });
            const screen = new THREE.Mesh(screenGeom, matScreen);
            screen.position.set(0, 5, d/2); // 稍微突出一半
            robotGroup.add(screen);

            // 3. 眼睛 (Eyes) - 两个矩形
            const eyeGeom = new THREE.PlaneGeometry(18, 22);
            const matEye = new THREE.MeshBasicMaterial({ color: THEME.eyeColor }); // 自发光
            
            leftEye = new THREE.Mesh(eyeGeom, matEye);
            leftEye.position.set(-20, 5, d/2 + 3); // 左眼
            robotGroup.add(leftEye);

            rightEye = new THREE.Mesh(eyeGeom, matEye);
            rightEye.position.set(20, 5, d/2 + 3); // 右眼
            robotGroup.add(rightEye);

            // 4. 耳朵/旋钮 (Ears)
            const earGeom = new THREE.CylinderGeometry(12, 12, 10, 32);
            earGeom.rotateZ(Math.PI/2);
            const matDark = new THREE.MeshStandardMaterial({ color: THEME.robotDark });
            const leftEar = new THREE.Mesh(earGeom, matDark);
            leftEar.position.set(-w/2 - 5, 0, 0);
            robotGroup.add(leftEar);
            
            const rightEar = new THREE.Mesh(earGeom, matDark);
            rightEar.position.set(w/2 + 5, 0, 0);
            robotGroup.add(rightEar);

            // 5. 天线 (Antenna)
            const antStem = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 30), matDark);
            antStem.position.set(0, h/2 + 15, 0);
            robotGroup.add(antStem);
            const antBall = new THREE.Mesh(new THREE.SphereGeometry(6), new THREE.MeshStandardMaterial({color: 0xe74c3c}));
            antBall.position.set(0, h/2 + 30, 0);
            robotGroup.add(antBall);

            // 6. 出纸口 (Side Slot) - 左侧 (X-)
            // 做一个明显的凹槽结构
            const slotFrameGeom = new THREE.BoxGeometry(5, 70, 80);
            const slotFrame = new THREE.Mesh(slotFrameGeom, matDark);
            slotFrame.position.set(-w/2 + 2, -10, 0);
            robotGroup.add(slotFrame);
            
            // 7. 嘴巴 (Mouth) - 装饰性
            // 在屏幕下方加一个小矩形表示嘴巴
            const mouthGeom = new THREE.BoxGeometry(10, 4, 2);
            const mouth = new THREE.Mesh(mouthGeom, new THREE.MeshBasicMaterial({color: 0x555555}));
            mouth.position.set(0, -20, d/2 + 3);
            robotGroup.add(mouth);

            mainGroup.add(robotGroup);
        }

        // 眨眼动画逻辑
        function startBlinking() {
            const blink = () => {
                if (leftEye && rightEye) {
                    // 闭眼 (Y轴缩放为0.1)
                    leftEye.scale.y = 0.1;
                    rightEye.scale.y = 0.1;
                    
                    setTimeout(() => {
                        // 睁眼
                        leftEye.scale.y = 1;
                        rightEye.scale.y = 1;
                    }, 150);
                }
                // 随机间隔眨眼
                setTimeout(blink, Math.random() * 3000 + 2000);
            };
            setTimeout(blink, 2000);
        }

        function createPaper() {
            const texWidth = 1024;
            const texHeight = 256;
            
            const canvas = document.createElement('canvas');
            canvas.width = texWidth; canvas.height = texHeight;
            const ctx = canvas.getContext('2d');

            const canvasBump = document.createElement('canvas');
            canvasBump.width = texWidth; canvasBump.height = texHeight;
            const ctxBump = canvasBump.getContext('2d');

            // 1. 底色
            ctx.fillStyle = THEME.paperBase;
            ctx.fillRect(0, 0, texWidth, texHeight);
            ctxBump.fillStyle = '#808080';
            ctxBump.fillRect(0, 0, texWidth, texHeight);

            // 2. 纹理
            for(let i=0; i<30000; i++) {
                ctx.fillStyle = Math.random()>0.5 ? 'rgba(0,0,0,0.02)' : 'rgba(255,255,255,0.3)';
                ctx.fillRect(Math.random()*texWidth, Math.random()*texHeight, 2, 2);
            }
            for(let i=0; i<50000; i++) {
                const g = Math.floor(Math.random()*255);
                ctxBump.fillStyle = `rgb(${g},${g},${g})`;
                ctxBump.fillRect(Math.random()*texWidth, Math.random()*texHeight, 2, 2);
            }

            // 3. 边缘阴影
            const gradientSize = 10; 
            const topGrad = ctx.createLinearGradient(0, 0, 0, gradientSize);
            topGrad.addColorStop(0, 'rgba(0,0,0,0.15)'); topGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = topGrad; ctx.fillRect(0, 0, texWidth, gradientSize);
            
            const bottomGrad = ctx.createLinearGradient(0, texHeight - gradientSize, 0, texHeight);
            bottomGrad.addColorStop(0, 'rgba(0,0,0,0)'); bottomGrad.addColorStop(1, 'rgba(0,0,0,0.15)');
            ctx.fillStyle = bottomGrad; ctx.fillRect(0, texHeight - gradientSize, texWidth, gradientSize);

            // 4. 格线
            ctx.strokeStyle = '#dcdde1'; 
            ctx.lineWidth = 1;
            for (let y = 64; y < texHeight; y += 64) {
                ctx.beginPath(); ctx.moveTo(50, y); ctx.lineTo(texWidth - 50, y); ctx.stroke();
            }

            ctxBump.fillStyle = '#505050';
            ctxBump.fillRect(0, 0, texWidth, 4);
            ctxBump.fillRect(0, texHeight-4, texWidth, 4);

            const texColor = new THREE.CanvasTexture(canvas);
            texColor.anisotropy = renderer.capabilities.getMaxAnisotropy();
            const texBump = new THREE.CanvasTexture(canvasBump);
            texBump.anisotropy = renderer.capabilities.getMaxAnisotropy();

            const geometry = new THREE.PlaneGeometry(CONFIG.paperWidth, CONFIG.paperHeight, CONFIG.segments, 1);
            const posAttr = geometry.attributes.position;
            for(let i=0; i<posAttr.count; i++){
                originalPositions.push(new THREE.Vector3(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i)));
            }

            const material = new THREE.MeshStandardMaterial({
                map: texColor,
                bumpMap: texBump,
                bumpScale: 0.8,
                side: THREE.DoubleSide,
                color: 0xffffff,
                roughness: 0.9,
                metalness: 0.0,
                polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1
            });

            paperMesh = new THREE.Mesh(geometry, material);
            paperMesh.receiveShadow = true;
            paperMesh.castShadow = true;
            mainGroup.add(paperMesh);
        }

        function updateScroll(progress) {
            const W = CONFIG.paperWidth;
            const P = 120; // Robot Width
            
            const canvasWidth = dockContainer.clientWidth;
            const rightDockX = (canvasWidth / 2) * (canvasWidth > 800 ? 0.7 : 0.8) - P/2;
            const centerDockX = W / 2;

            // 1. 移动机器人
            const currentRobotX = THREE.MathUtils.lerp(rightDockX, centerDockX, progress);
            robotGroup.position.x = currentRobotX;

            // 2. 吐纸计算 (出纸口在机器人左侧 -60)
            const mouthX = currentRobotX - (P/2); 

            const visibleLength = W * progress;
            const positions = paperMesh.geometry.attributes.position;
            
            for (let i = 0; i < originalPositions.length; i++) {
                const orig = originalPositions[i];
                const distFromRightEdge = (W/2) - orig.x; 
                
                let newX, newY, newZ;

                if (distFromRightEdge <= visibleLength) {
                    newX = mouthX - distFromRightEdge;
                    newY = orig.y;
                    newZ = 0;
                } else {
                    newX = mouthX + 2; 
                    newY = orig.y;
                    newZ = 0;
                }
                positions.setXYZ(i, newX, newY, newZ);
            }
            positions.needsUpdate = true;
            paperMesh.geometry.computeVertexNormals();
        }

        function toggle() {
            if (isAnimating) return;
            isAnimating = true;

            const target = isExpanded ? 0 : 1;
            
            if (isExpanded) {
                inputContainer.style.opacity = '0';
                inputContainer.style.pointerEvents = 'none';
            }

            new TWEEN.Tween(animState)
                .to({ val: target }, CONFIG.animDuration)
                .easing(target === 1 ? TWEEN.Easing.Elastic.Out : TWEEN.Easing.Cubic.InOut)
                .onUpdate(() => updateScroll(animState.val))
                .onComplete(() => {
                    isAnimating = false;
                    isExpanded = !isExpanded;
                    if (isExpanded) {
                        inputContainer.style.opacity = '1';
                        inputContainer.style.pointerEvents = 'auto';
                        inputField.focus();
                    }
                })
                .start();
        }

        function onResize() {
            const width = dockContainer.clientWidth;
            const height = dockContainer.clientHeight;
            const aspect = width / height;
            
            const f = CONFIG.cameraFrustum;
            camera.left = f * aspect / -2;
            camera.right = f * aspect / 2;
            camera.top = f / 2;
            camera.bottom = f / -2;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            
            updateInputLayout();
            if(!isAnimating) updateScroll(animState.val);
        }

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
